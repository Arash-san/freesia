name: macOS

# Builds and checks the macOS app on every desktop change, and for every release:
# release.yml calls this workflow first and only publishes if it passes.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"
  pull_request:
    paths-ignore:
      - "android/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test native recording and overlay
        run: npm run test:native

      - name: Build disk images
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Mounts each disk image, verifies the signature and starts the packaged app
      - name: Check the packaged app starts
        run: bash scripts/mac-smoke.sh

      - name: Upload disk images
        uses: actions/upload-artifact@v4
        with:
          name: freesia-macos
          path: dist/*.dmg
          if-no-files-found: error
