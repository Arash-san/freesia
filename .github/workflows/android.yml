name: Android release

# Builds, tests and publishes Freesia for Android as its own GitHub release
# (tag android-vX.Y.Z, never marked "latest": the desktop updater owns that).
# The app's in-app updater reads these releases.

on:
  push:
    tags:
      - "android-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (android-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and publish the Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches versionName
        run: |
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag '$TAG' is not android-vX.Y.Z"; exit 1; }
          version="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)"
          if [[ "${TAG#android-v}" != "$version" ]]; then
            echo "::error::Tag $TAG does not match versionName $version in android/app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the retired "tools" package, which no
          # longer exists in the SDK repository and fails the step.
          packages: platform-tools

      - name: Install platform 37 and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Write the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          keys="$RUNNER_TEMP/freesia-keys"
          mkdir -p "$keys" && chmod 700 "$keys"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keys/release.jks"
          # Same format as ~/.freesia-android/keystore.properties; storeFile is relative to this file
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$keys/keystore.properties"
          chmod 600 "$keys/release.jks" "$keys/keystore.properties"
          echo "FREESIA_KEYSTORE_PROPS=$keys/keystore.properties" >> "$GITHUB_ENV"

      # Live-server tests skip themselves: no test account is configured in CI.
      - name: Unit tests, lint and signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleRelease

      - name: Verify the signature and name the APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | grep -m2 "Signer #1"
          mkdir -p out
          cp "$apk" "out/Freesia-Android-$VERSION.apk"
          (cd out && sha256sum "Freesia-Android-$VERSION.apk" > "Freesia-Android-$VERSION.apk.sha256" && cat ./*.sha256)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > out/notes.md || true
          if [[ ! -s out/notes.md ]]; then echo "Freesia for Android $VERSION." > out/notes.md; fi
          {
            echo
            echo "Install: download \`Freesia-Android-$VERSION.apk\` on the phone and open it, or use the Update button in Freesia."
            echo "SHA-256: \`$(cut -d' ' -f1 "out/Freesia-Android-$VERSION.apk.sha256")\`"
          } >> out/notes.md

      - name: Publish the GitHub release (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("out/Freesia-Android-$VERSION.apk" "out/Freesia-Android-$VERSION.apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file out/notes.md --latest=false
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Freesia for Android $VERSION" \
              --notes-file out/notes.md \
              --latest=false
          fi

      - name: Keep the test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ env.TAG }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/freesia-keys"
