<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Freesia 3 app icon: an iridescent five-petal bloom on a graphite tile.
       Rendered to icon.png / icon.ico by scripts/build-icons.cjs. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#23202e"/>
      <stop offset="0.6" stop-color="#121117"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9d7cff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff5fa2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a9dff"/><stop offset="1" stop-color="#9fd0ff"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8f6bff"/><stop offset="1" stop-color="#cdbbff"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5fa2"/><stop offset="1" stop-color="#ffb3d2"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ffe0a8"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6b7dff"/><stop offset="1" stop-color="#ff9ec7"/></linearGradient>
    <radialGradient id="heart" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.5" stop-color="#ffd48a"/>
      <stop offset="1" stop-color="#ff9b54" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
    <!-- One petal, pointing up from the centre (512,512) -->
    <path id="petal" d="M512 512 C 430 440, 420 300, 512 196 C 604 300, 594 440, 512 512 Z"/>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="33" y="33" width="958" height="958" rx="223" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)" filter="url(#soft)"/>

  <g filter="url(#shadow)" style="mix-blend-mode:normal">
    <g opacity="0.94">
      <use href="#petal" fill="url(#p1)" transform="rotate(0 512 512)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(72 512 512)"/>
      <use href="#petal" fill="url(#p3)" transform="rotate(144 512 512)"/>
      <use href="#petal" fill="url(#p4)" transform="rotate(216 512 512)"/>
      <use href="#petal" fill="url(#p5)" transform="rotate(288 512 512)"/>
    </g>
    <!-- Inner petals, smaller and offset, for depth -->
    <g opacity="0.55" style="mix-blend-mode:screen">
      <use href="#petal" fill="url(#p3)" transform="rotate(36 512 512) scale(0.62) translate(313.8 313.8)"/>
      <use href="#petal" fill="url(#p1)" transform="rotate(108 512 512) scale(0.62) translate(313.8 313.8)"/>
      <use href="#petal" fill="url(#p4)" transform="rotate(180 512 512) scale(0.62) translate(313.8 313.8)"/>
      <use href="#petal" fill="url(#p2)" transform="rotate(252 512 512) scale(0.62) translate(313.8 313.8)"/>
      <use href="#petal" fill="url(#p5)" transform="rotate(324 512 512) scale(0.62) translate(313.8 313.8)"/>
    </g>
    <circle cx="512" cy="512" r="74" fill="url(#heart)"/>
    <circle cx="512" cy="506" r="26" fill="#fffaf0" opacity="0.95"/>
  </g>
</svg>
