<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Freesia overlay</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--font-ui); -webkit-font-smoothing: antialiased; user-select: none; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; }
    .pill {
      --w: 236px;
      position: relative; width: var(--w); height: 54px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 7px;
      background: rgba(14, 14, 18, 0.9); color: #f2f2f5;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.09) inset, 0 18px 40px -12px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.4);
      backdrop-filter: blur(18px) saturate(1.4);
      opacity: 0; transform: translateY(14px) scale(0.86); filter: blur(4px);
      transition: opacity 260ms cubic-bezier(.22,1,.36,1), transform 520ms cubic-bezier(.34,1.56,.64,1), filter 260ms, width 420ms cubic-bezier(.34,1.56,.64,1);
    }
    .pill.show { opacity: 1; transform: none; filter: none; }
    .pill.wide { --w: 300px; }
    /* Iridescent rim that only glows while listening */
    .pill::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: var(--bloom-conic);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity 300ms; animation: rim 4s linear infinite;
    }
    .pill.listening::before { opacity: calc(0.35 + var(--lvl, 0) * 0.65); }
    @keyframes rim { to { filter: hue-rotate(360deg); } }
    .orb { width: 42px; height: 42px; flex-shrink: 0; position: relative; }
    .orb canvas { position: absolute; inset: -14px; width: 70px; height: 70px; }
    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
    .label { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 11.5px; color: #9a9aa6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .timer { font: 560 13px var(--font-mono); color: #d8d8e0; font-variant-numeric: tabular-nums; }
    .esc { font: 500 10px var(--font-mono); color: #8a8a96; border: 1px solid rgba(255,255,255,0.14); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; margin-left: 4px; }
    .right { display: flex; align-items: center; }
    .processing .label { background: linear-gradient(90deg, #8a8a96, #fff 45%, #8a8a96 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.4s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .check { width: 22px; height: 22px; }
    .check path { stroke-dasharray: 24; stroke-dashoffset: 24; }
    .done .check path { animation: draw 420ms 120ms cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .error { animation: shake 420ms cubic-bezier(.36,.07,.19,.97); }
    .error .label { color: #ffb1b8; }
    @keyframes shake { 10%, 90% { translate: -1px 0; } 20%, 80% { translate: 2px 0; } 30%, 50%, 70% { translate: -4px 0; } 40%, 60% { translate: 4px 0; } }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="pill" id="pill">
      <div class="orb"><canvas id="orb"></canvas></div>
      <div class="text"><span class="label" id="label">Listening</span><span class="sub" id="sub"></span></div>
      <div class="right">
        <span class="timer" id="timer">0:00</span><span class="esc" id="esc">Esc</span>
        <svg class="check" id="check" viewBox="0 0 24 24" fill="none" stroke="#5ee4a6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
    </div>
  </div>
  <script src="js/orb.js"></script>
  <script>
    const pill = document.getElementById('pill');
    const label = document.getElementById('label');
    const sub = document.getElementById('sub');
    const timer = document.getElementById('timer');
    const esc = document.getElementById('esc');
    const check = document.getElementById('check');
    const orb = window.createBloomOrb(document.getElementById('orb'), { scale: 0.3 });
    let mode = 'dictate';

    function render(msg) {
      const { state } = msg;
      if (state === 'hidden') { pill.classList.remove('show'); orb.setState('idle'); return; }
      if (msg.mode) mode = msg.mode;
      pill.className = `pill show ${state}`;
      timer.hidden = esc.hidden = state !== 'listening';
      check.hidden = state !== 'done';
      orb.setState(state === 'listening' ? 'listening' : state === 'processing' ? 'processing' : state === 'done' ? 'done' : state === 'error' ? 'error' : 'idle');
      if (state === 'listening') {
        label.textContent = mode === 'command' ? 'Editing by voice' : 'Listening';
        sub.textContent = msg.hint || (mode === 'command' ? 'Say how to change it' : 'Press again to finish');
        timer.textContent = '0:00';
      } else if (state === 'processing') {
        label.textContent = msg.label === 'Formatting' ? 'Shaping your words' : 'Transcribing';
        sub.textContent = msg.label && msg.label !== 'Formatting' ? msg.label : '';
      } else if (state === 'done') {
        label.textContent = 'Done';
        sub.textContent = msg.label || '';
      } else if (state === 'error') {
        label.textContent = 'Couldn’t finish';
        sub.textContent = msg.message || 'Your recording is saved';
        pill.classList.add('wide');
      }
      pill.classList.toggle('wide', state === 'error' || (sub.textContent || '').length > 30);
    }

    window.freesia.onOverlayState((msg) => render(typeof msg === 'string' ? { state: msg } : (msg || {})));
    window.freesia.onOverlayTimer((t) => { timer.textContent = t; });
    window.freesia.onOverlayAudioLevel((level) => {
      const l = pill.classList.contains('listening') ? Math.max(0, Math.min(1, Number(level) || 0)) : 0;
      orb.setLevel(l);
      pill.style.setProperty('--lvl', l.toFixed(3));
    });
  </script>
</body>
</html>
